# ==============================================================
# Claude Design スライド指示書テンプレート（ADR-0016 / ADR-0017）
#
# 保存先: docs/design/decks/<案件名>/spec.yml
#
# 方針: 「何を・どのくらい」は決め、「どう見せるか・どう書くか」は Claude Design に任せる。
#   - ページごとに書くのは「主張（message）と材料」。表示する完成文は書かない
#   - レイアウト・図の種類・文章表現・装飾は書かない（layout / slots / values は持たない）
#   - 量は deck.max_pages と章ごとの max_pages で縛る
#
# Claude Design に渡すもの（これ以外は渡さない）:
#   1. この spec.yml
#   2. デザインシステム（design_system.source）
#   3. deck.deck_type に対応する型ファイル 1 つだけ
#      .claude/skills/slide-spec-writer/references/deck-types/<deck_type>.md
#      （他の型ファイルは渡さない。別の型に引っ張られるため）
#   4. materials に書いたファイル
# ==============================================================

meta:
  title: ""                      # 資料のタイトル
  subtitle: ""                   # サブタイトル / 一言説明
  purpose: ""                    # この資料で読み手に何を持ち帰らせたいか / 何を決めたいか
  audience: ""                   # 誰に見せるか（前提知識の有無も書く。例: エンジニア以外も含む）
  tone: "落ち着いた・事実ベース・装飾過多にしない"
  language: ja
  aspect_ratio: "16:9"
  delivery: "画面投影"            # 画面投影 / 資料配布 / 両方

# --------------------------------------------------------------
# デザインシステム（参照のみ）
#
# ★ 色・フォント・文字サイズ・余白などの値をここに複製しない。正本は source の 1 ファイルだけ。
# --------------------------------------------------------------
design_system:
  source: "docs/design/design-system-notion-like.md"

  # この案件だけ正本から外す場合のみ記載する。空なら正本どおり。
  # 逸脱には必ず理由を書く（「見栄えのため」は理由にならない）。
  overrides: {}
    # 例:
    # color.accent: "#0F766E"   # reason: コーポレートカラーに合わせる

# --------------------------------------------------------------
# 全体構成（資料の種類・量）
# --------------------------------------------------------------
deck:
  # 資料タイプ。references/deck-types/<deck_type>.md が存在する種類だけを書く（例: handson）。
  # 型が無い種類の資料なら "" のままにする。その場合は content.pages の並び順と各ページの
  # message で情報の順序を決め、型は作らない（良い出力が出てから型に起こす。SKILL.md 参照）。
  deck_type: ""

  # 資料全体のページ上限。chapters の max_pages の合計以下にする。
  # ★ 上限を超えそうなときはページを分割しない。優先度の低い情報から削る。
  max_pages: 0

  # 章ごとのページ上限。章扉などを置く場合もその章のページ数に含める。
  chapters:
    - id: ""                     # ページの chapter から参照する短い ID（例: opening / l01 / practice）
      title: ""                  # 章の名前
      max_pages: 0               # この章で使ってよいページ数の上限
      # minutes: 0               # 持ち時間があれば書く（任意）

# --------------------------------------------------------------
# 全ページ共通の制約
#
# ★ デザイン上の禁止事項は正本の「7. Do's and Don'ts」が唯一の定義。ここに複製しない。
#   文字サイズ・余白などの値も正本（design_system.source）に従う。
# --------------------------------------------------------------
constraints:
  ng_source: "docs/design/design-system-notion-like.md#7-dos-and-dontsガードレール"

  # 資料全体で書いてはいけないこと（用語の揺れ・前提の誤りなど）。
  # 特定のページだけの話はそのページの avoid に書く。
  avoid: []

  # 出力を受け取ったあとに確認すること
  checklist:
    - "各ページの message だけを順に読んで筋が通るか"
    - "各ページの must_include がすべて入っているか"
    - "章ごとのページ数が max_pages 以内か（分割でページを増やしていないか）"
    - "全ページに講師メモ（speaker_notes）が入っているか"
    - "数値に出典と期間があるか"
    - "図表の色が正本の図表 3 色ルールに収まっているか"

# --------------------------------------------------------------
# 素材（画像・xlsx・元資料）
#
# ファイルは同じ案件ディレクトリの materials/ に置き、相対パスで参照する。
#   docs/design/decks/<案件名>/
#   ├── spec.yml      ← このファイル
#   └── materials/    ← ここ
# Claude Design には spec.yml と一緒にこれらのファイルも渡す。
# --------------------------------------------------------------
# 素材が無ければ [] のままにする。ある場合は下記の形で足す。
#   - path: "materials/kpi-2026q3.xlsx"   # 案件ディレクトリからの相対パス
#     kind: "spreadsheet"                 # image / spreadsheet / document / other
#     used_by: [6, 10]                    # 使うページ番号
#     note: "2026Q3 のKPI実績。出典: 社内BI / 期間: 2026-07〜09"
materials: []

# --------------------------------------------------------------
# 内容
# --------------------------------------------------------------
content:
  raw_input: |
    （ここに元ネタ・議事メモ・データを貼る）

  # ページごとの指示。キーは下記の 8 つだけを使う。
  pages:
    - page: 1                      # ページ番号（並び順 = 情報の順序）
      chapter: ""                # deck.chapters の id
      role: ""                   # 型の中での役割（任意）。型ファイルにある役割名を書く（例: 表紙 / 説明 / 実践 / 強調）

      # 伝えたい主張を 1 つ。★ 表示する文ではない。Claude Design が見出しや本文の表現を決める。
      message: ""

      # 外せない事実・固有名詞・数値・パス。無いと読み手が困るものだけを書く。
      # ★ 完成文を並べない。事実を短く書く。
      must_include: []

      # 書くための材料・背景・口頭で話すこと。表示する文より多く書いてよい。
      # 取捨選択と表現は Claude Design に任せる。
      notes: |

      # このページで書いてはいけないこと（誤解を招く表現・古い前提・他ページで扱う話など）。
      avoid: []

      # 講師メモ（発表者ノート）。★ 全ページ必須。話す要点・時間・注意を書く。
      speaker_notes: ""
