# Claude ハンズオン「AI駆動で、業務をやる。」構成案
#
# スキーマ: deck / chapters[].slides[]{title, summary, content, expression, data}
#   expression の語彙: title | bullet | comparison | chart | flow | structure | emphasis
#   先行例: domains/presentation/decks/data-analysis-platform/outline.yml
#   summary = そのスライドで「伝えたいこと」（1メッセージ）
#
# 対象ツール: Claude（Claude Code）のみ。GitHub Copilot 前提の記述と
# Appendix「Claude Code 対応表」は本改訂で全廃した。
#
# 時間配分（合計 90 分）:
#   座学     33分 / 26枚（うちデモ 3分）
#   実践     47分 / 10枚
#   振り返り 10分 /  2枚
#
# 用語の方針:
#   「loop駆動」は使わない。段階名は「複利化」とし、業界呼称（Compounding
#   Engineering / Loop Engineering）は注記で残す。life-os リポジトリは
#   「Loop Engineering」を正式名として採用しているため、L01 の複利化サイクル
#   スライドに橋渡しの1行を入れている。
#   部品名は「Subagent」に統一する（段階名「エージェント駆動」との衝突を避けるため）。
#
# 未確定（ハンズオン用リポジトリの Claude 版が再作成中のため）:
#   「※リポジトリ確定後に記載」と書いた箇所は、リポジトリの実物と揃えて後日埋める。

deck:
  title: "AI駆動で、業務をやる。"
  subtitle: "Claude ではじめる、自分の作業のAI化ハンズオン"
  theme: default
  date: "2026-06-23"

chapters:
  - chapter: "オープニング"
    slides:
      - title: "AI駆動で、業務をやる。"
        summary: "「開発」を超えて、すべての業務をAI駆動に。本日は Claude で自分の作業をAI化するハンズオン。"
        content:
          - "AI-DRIVEN WORK — Hands-on / 2026-06-23"
          - "「開発」を超えて、すべての業務をAI駆動に。"
          - "Skill / Rule / Subagent / Hook / MCP / Plugin ハンズオン"
          - "主要ツール: Claude Code"
        expression: title
        data: {}

      - title: "本日の目的"
        summary: "「自分の作業をAIに任せる型」を持ち帰る。それが今日のゴール。"
        content:
          - "本日は自分の作業を1つ選び、Claude に任せられる形にして、実際に動かすところまでやる"
          - "作って終わりではなく、出力への不満を Skill に書き戻すところまで一周する"
          - "持ち帰って自分の仕事で回し続けることが本番"
        expression: emphasis
        data:
          mode: message
          text: "\"自分の作業をAIに任せる型\"を、持ち帰る"

      - title: "本日の流れ"
        summary: "座学33分で「なぜ・何を」、実践47分で「どうやって」を一周し、10分で持ち帰りを固める。"
        content:
          - "座学 33分: AI駆動の現在地 / Claude を構成する部品 / どこに置くか"
          - "実践 47分: 棚卸し → Skill作成 → 実行 → 不満を挙げる → 修正 → 再実行"
          - "振り返り 10分: 成果物の確認 / 明日やる1つ / 次のリソース"
          - "実践は「作って終わり」にしない。修正して再実行するところまでを 47 分に含む"
        expression: comparison
        data:
          mode: table
          axes: ["時間", "やること"]
          columns:
            - { name: "座学", values: ["33分", "AI駆動の現在地 / 部品 / 置き場所"] }
            - { name: "実践 前半", values: ["32分", "棚卸し → Skill作成 → 実行"] }
            - { name: "実践 後半", values: ["15分", "不満を挙げる → 修正 → 再実行"] }
            - { name: "振り返り", values: ["10分", "成果物 / 明日やる1つ / 次のリソース"] }

      - title: "はじめる前に — 動く状態か確認"
        summary: "ここで詰まると実践47分が丸ごと溶ける。先に全員の環境を揃える。"
        content:
          - "□ Claude Code がインストール済みで、起動して認証が通る"
          - "□ ハンズオン用リポジトリを clone / fork 済み（※リポジトリ確定後に記載）"
          - "□ 手元で `claude` が起動し、リポジトリのルートで対話できる"
          - "□ 動いていない方はこの時点で挙手 — 実践が始まる前に解消します"
        expression: bullet
        data: {}

      - title: "【デモ】議事録からタスク化まで、全自動"
        summary: "Claudeに任せるとはこういうこと。人は「投げる」と「確認する」だけ。"
        content:
          - "① ミーティングのトランスクリプト（Teams から書き出したテキスト）を Claude に渡す"
          - "② 決定事項・議論・宿題を整理した議事録が生成される"
          - "③ 宿題が GitHub Projects のタスクとして起票される（MCP 経由）"
          - "④ 人がやったのは「渡す」と「できたものを確認する」だけ"
          - "この裏側は6つの部品でできています。座学の後半で分解します"
        expression: flow
        data:
          type: steps
          orientation: horizontal
          steps:
            - label: "投げる"
              desc: "Teams から書き出したトランスクリプトを、そのまま Claude に渡す"
            - label: "議事録化"
              desc: "決定事項・議論・宿題を、決められたフォーマットに整理する"
            - label: "タスク化"
              desc: "宿題を GitHub Projects のタスクとして MCP 経由で起票する"
            - label: "確認する"
              desc: "人の仕事は、できあがったものを見て過不足を指摘することだけ"

  - chapter: "L01 / AI駆動の現在地"
    slides:
      - title: "AI駆動の現在地"
        summary: "「AIにコードを書かせる」段階は終わり、「AIに仕事を任せて、育てる」段階へ。"
        content:
          - "LECTURE / 01"
        expression: title
        data: {}

      - title: "AI活用の4段階"
        summary: "手動→補助→エージェント駆動→複利化。人の関与が「やる」から「設計する」に変わる。"
        content:
          - "01 手動: 自分で書く。AIは介在しない"
          - "02 補助: 補完・チャットで聞く。人が主役、AIは助手"
          - "03 エージェント駆動: タスクごと任せて、人はレビューする"
          - "04 複利化: スキルを書いて回す。やるほど次が楽になる"
          - "本日のゴールは、エージェント駆動を身につけ、複利化の入り口に立つこと"
        expression: flow
        data:
          type: steps
          orientation: horizontal
          steps:
            - label: "01 手動"
              desc: "自分で書く。AIは介在しない。主役は人"
            - label: "02 補助"
              desc: "補完やチャットで聞く。人が主役、AIは助手"
            - label: "03 エージェント駆動"
              desc: "タスクごと任せて、人はレビュアーに回る"
            - label: "04 複利化"
              desc: "スキルを書いて回す。やるほど知識が貯まり、次の作業が楽になる"

      - title: "複利化サイクル — AIに任せる作業の育て方"
        summary: "AIの出力に不満が出たら、直すのはプロンプトではなく“スキル”。"
        content:
          - "① 自分がやっている作業を見つける"
          - "② スキル / サブエージェントに書き出す"
          - "③ AI に実行させる（生成）"
          - "④ 出力を見て「もっとこうしてほしい」を見つける ← ★人間の仕事はここ★"
          - "⑤ スキルを直す → ① へ戻る"
          - "業界では Compounding Engineering / Loop Engineering と呼ばれる。life-os リポジトリでは「Loop Engineering」と呼んでいて、その中身がこの複利化サイクル"
        expression: flow
        data:
          type: cycle
          steps:
            - label: "① 見つける"
              desc: "自分が繰り返しやっている作業を見つける"
            - label: "② 書き出す"
              desc: "手順を Skill / Subagent として書き出す"
            - label: "③ 実行させる"
              desc: "AI に実行させ、成果物を生成させる"
            - label: "④ 不満を見つける"
              desc: "出力を見て「もっとこうしてほしい」を1つ見つける。人間の仕事はここ"
            - label: "⑤ 直す"
              desc: "プロンプトではなく Skill を直し、①へ戻る"

      - title: "変わるのは、人の役割"
        summary: "「どう書くか」から「何を任せ、どう確かめるか」へ。実装者から設計者・レビュアーへ。"
        content:
          - "対象は開発だけでなく、調査・資料作成・運用・定型連絡まで広がる"
          - "人がやるのは「手を動かすこと」から「フローを設計し、任せ、確かめること」へ"
          - "差がつくのは「何を任せるか」の設計と、そのための資産づくり"
        expression: comparison
        data:
          mode: two-column
          left:
            label: "これまで — 実装者"
            items:
              - "自分で手順を実行する"
              - "「どう書くか」を考える"
              - "対象は自分の担当領域"
          right:
            label: "これから — 設計者・レビュアー"
            items:
              - "任せる形を設計し、結果を確かめる"
              - "「何を任せ、どう確かめるか」を考える"
              - "対象は調査・資料作成・運用まで全業務"

      - title: "3回やったら、AI化。"
        summary: "「面倒・毎回ググる・コピペ」を感じた瞬間が、AI化のシグナル。"
        content:
          - "繰り返しに気付く: 「手動で繰り返している作業はないか？」を常に問う"
          - "手順が固まっている: 3回以上やった作業は、既に仕組み化できるだけ手順が固まっている"
          - "効果が大きい候補: 「面倒・毎回ググる・コピペ」が多い作業ほど、AI化の効果が大きい"
          - "シグナルを見逃さない: 「面倒」を感じた瞬間こそ、AI化のシグナル"
        expression: bullet
        data: {}

  - chapter: "L02 / Claude を構成する部品"
    slides:
      - title: "Claude を構成する部品"
        summary: "CLAUDE.md を土台に、6つの部品を積み上げるほど任せられる範囲が広がる。"
        content:
          - "LECTURE / 02"
        expression: title
        data: {}

      - title: "1つの共通方針 + 6種のAI資産"
        summary: "CLAUDE.md が土台。その上に6つの部品を積み上げるほど、AIの守備範囲が広がる。"
        content:
          - "共通方針 CLAUDE.md: 全セッションで常時ロードされる、リポジトリ全体の前提と方針"
          - "Skill / Rule: 手順と規約を渡す"
          - "Subagent / Hook: 仕事を分業させ、実行に歯止めをかける"
          - "MCP / Plugin: 外部ツールにつなぎ、作った資産を配る"
          - "本日のハンズオンで実際に作るのは Skill。残りは「この先こう広がる」地図として見てください"
        expression: structure
        data:
          type: pyramid
          layers:
            - "共通方針: CLAUDE.md — 全セッションで常時ロードされる前提と方針"
            - "手順と規約: Skill / Rule"
            - "分業と歯止め: Subagent / Hook"
            - "接続と配布: MCP / Plugin"

      - title: "Skill ① — 2種類ある"
        summary: "Skill には「知識を渡す型」と「呼び出して実行する型」の2種類がある。"
        content:
          - "リファレンス型: API規約・スタイルガイドなど、判断に使う知識を渡す"
          - "アクション型: `/deploy` のように名前で呼び出す、手順そのもの"
          - "どちらもコンテキストに載るため、AIは「知っている」状態で作業できる"
          - "Subagent との違い: Skill はコンテキストを共有する。Subagent は分離して要約だけ返す"
        expression: comparison
        data:
          mode: two-column
          left:
            label: "リファレンス型 — 知識を渡す"
            items:
              - "API規約・スタイルガイド・用語集"
              - "「判断のときに参照してほしい」もの"
              - "例: 命名規則、レビュー観点"
          right:
            label: "アクション型 — 手順を呼び出す"
            items:
              - "名前を指定して起動するワークフロー"
              - "「この作業をやって」と言えるもの"
              - "例: 議事録作成、リリース手順"

      - title: "Skill ② — 今日作るのはこれ"
        summary: "本日の実践では、自分の繰り返し作業をアクション型 Skill として1つ作る。"
        content:
          - "SKILL.md に「いつ使うか」「手順」「守ること」を書くだけで作れる"
          - "※リポジトリ確定後に記載（同梱するサンプル Skill と、その中身の説明）"
          - "※リポジトリ確定後に記載（実践で作る Skill の題材例）"
          - "作った Skill は、実行 → 不満を見つける → 修正、で育てていく"
        expression: flow
        data:
          type: steps
          orientation: vertical
          steps:
            - label: "いつ使うか を書く"
              desc: "どんな依頼のときにこの Skill が呼ばれるべきかを書く"
            - label: "手順を書く"
              desc: "自分が普段やっている順番を、そのまま箇条書きにする"
            - label: "守ることを書く"
              desc: "禁止事項・前提・出力フォーマットなど、外してほしくない条件を書く"
            - label: "呼び出して試す"
              desc: "実際に呼び出し、出力を見て手順を書き足していく"

      - title: "Rule — `.claude/rules/`"
        summary: "CLAUDE.md との違いは、ロードのされ方だけ。常時か、触ったときだけか。"
        content:
          - "CLAUDE.md: 全セッションで常時ロードされる。リポジトリ全体の前提"
          - "`.claude/rules/`: `paths` frontmatter で、該当ファイルを触ったときだけロードされる"
          - "経験則: CLAUDE.md は200行以下に保つ。超えたら `rules/` か Skill に逃がす"
          - "「Python を触るときだけの規約」のような、条件付きの規約を置く場所"
        expression: comparison
        data:
          mode: table
          axes: ["いつロードされるか", "何を書くか"]
          columns:
            - { name: "CLAUDE.md", values: ["全セッションで常時", "リポジトリ全体の前提・方針（200行以下に保つ）"] }
            - { name: ".claude/rules/", values: ["paths に一致するファイルを触ったときだけ", "特定のファイル種別・領域にだけ効かせたい規約"] }

      - title: "Subagent — 役割別の分身"
        summary: "独自のコンテキストを持つ独立ワーカーに分業させ、本体の会話を汚さない。"
        content:
          - "設計 / 実行 / レビューなど、役割ごとに専門ワーカーを立てる"
          - "コンテキストが分離され、本体にはサマリーだけ返る"
          - "多ファイル読み込み・並列作業・調査など、脇道の出力が多い作業に向く"
          - "発展形として Agent teams（独立セッション同士が直接メッセージし合い、共有タスクリストで自己調整する）。※実験的機能・デフォルト無効"
        expression: comparison
        data:
          mode: table
          axes: ["それは何か", "主な利点", "最適な用途"]
          columns:
            - { name: "Skill", values: ["再利用可能な指示・知識・ワークフロー", "コンテキスト全体でコンテンツを共有", "リファレンス、呼び出し可能なワークフロー"] }
            - { name: "Subagent", values: ["独自コンテキストを持つ独立ワーカー", "コンテキスト分離。サマリーのみ返る", "多ファイル読み込み、並列作業、専門ワーカー"] }

      - title: "Hook — 実行に歯止めをかける"
        summary: "エージェント実行の各タイミングで、自動的に処理を差し込める。"
        content:
          - "実行できるもの: シェルコマンド / HTTPリクエスト / LLMプロンプト / subagent"
          - "使いどころ: 危険操作のブロック、監査ログ、フォーマット自動実行、通知"
          - "「毎回聞かれずに、必ず実行してほしい」ことを Hook にする"
          - "人が見ていなくても効く、唯一の部品"
        expression: flow
        data:
          type: steps
          orientation: horizontal
          steps:
            - label: "実行前"
              desc: "危険な操作をブロックする、実行内容を検査する"
            - label: "実行中"
              desc: "監査ログを残す、外部システムへ通知する"
            - label: "実行後"
              desc: "フォーマッタやテストを自動で走らせる"
            - label: "セッション終了時"
              desc: "結果をまとめる、後片付けをする"

      - title: "MCP — 外部ツールに直接つなぐ"
        summary: "見えないツールの情報をコピペし続けるのをやめ、AIを直接つなぐ。"
        content:
          - "GitHub: Issue / PR / Projects の読み書き"
          - "Notion: ページ・データベースの検索と更新"
          - "その他、MCP サーバーが提供されているツールに接続できる"
          - "冒頭デモの「GitHub Projects へタスク起票」は、これで実現している"
          - "※Teams のトランスクリプトはファイルとして渡している（公式 MCP が使えるとは限らないため）"
        expression: structure
        data:
          type: tree
          root: "Claude Code"
          children:
            - name: "GitHub MCP — Issue / PR / Projects"
            - name: "Notion MCP — ページ・DB の検索と更新"
            - name: "その他の MCP サーバー — 社内ツール・SaaS"

      - title: "Plugin — 束ねて、配る"
        summary: "plugin が「束ねる」、marketplace が「配る」。自作して GitHub で公開できる。"
        content:
          - "Plugin: Skill / Rule / Subagent / Hook / MCP設定 をひとまとめにした配布単位"
          - "Marketplace: plugin を配布する仕組み。GitHub リポジトリをそのまま marketplace にできる"
          - "自分で作った資産を plugin にして公開すれば、他の人がそのまま導入できる"
          - "「別のリポジトリでも同じ環境が要る」と思ったら plugin にするタイミング"
        expression: comparison
        data:
          mode: two-column
          left:
            label: "Plugin — 束ねる"
            items:
              - "Skill / Rule / Subagent / Hook / MCP設定 を1つにまとめる"
              - "導入する側は1コマンドで環境が揃う"
          right:
            label: "Marketplace — 配る"
            items:
              - "GitHub リポジトリをそのまま marketplace にできる"
              - "自作 plugin を公開して、他の人に使ってもらえる"

      - title: "どれから作る？ — トリガー早見表"
        summary: "「3回やったらAI化」の次の問い。この状況になったら、この部品を作る。"
        content:
          - "困りごとの形で覚えると、部品の使い分けで迷わなくなる"
          - "本日のハンズオンは、この表の2行目「同じ手順書を3回目に貼っている」から始める"
        expression: comparison
        data:
          mode: table
          axes: ["これを作る"]
          columns:
            - { name: "規約やコマンドを Claude が2回間違える", values: ["CLAUDE.md に追記"] }
            - { name: "同じ手順書を3回目に貼っている", values: ["Skill にする"] }
            - { name: "特定のファイル種別だけのルールがある", values: [".claude/rules/"] }
            - { name: "毎回聞かれずに実行してほしい", values: ["Hook"] }
            - { name: "見えないツールの情報をコピペし続けている", values: ["MCP"] }
            - { name: "脇道の出力で会話が埋まる", values: ["Subagent"] }
            - { name: "別のリポジトリでも同じ環境が要る", values: ["Plugin"] }

      - title: "デモの裏側 — 6つの部品でできていた"
        summary: "冒頭のデモは、いま見た部品の組み合わせでできている。特別なことは何もしていない。"
        content:
          - "※デモ画面のスクリーンショットを再掲する（記憶を戻すため）"
          - "議事録のフォーマット → Skill（アクション型）"
          - "宿題の切り出しと分解 → Subagent"
          - "GitHub Projects への起票 → MCP"
          - "起票前の確認・機密チェック → Hook / CLAUDE.md"
        expression: structure
        data:
          type: tree
          root: "議事録→タスク化の自動化"
          children:
            - name: "Skill — 議事録のフォーマットと手順"
            - name: "Subagent — 宿題の切り出しと分解"
            - name: "MCP — GitHub Projects への起票"
            - name: "Hook / CLAUDE.md — 起票前の確認と機密チェック"

  - chapter: "L03 / どこに置くか"
    slides:
      - title: "どこに置くか"
        summary: "リポジトリ自体を、AI駆動の作業場にする。"
        content:
          - "LECTURE / 03"
        expression: title
        data: {}

      - title: "`.claude/` にAI資産を集約する"
        summary: "前提・手順・役割・安全装置を `.claude/` 配下に集約する。"
        content:
          - "CLAUDE.md: リポジトリ全体の前提・方針"
          - "rules/: 条件付きで効かせたい規約"
          - "skills/: 再利用する作業手順 ／ agents/: 役割特化の Subagent"
          - "hooks/ + settings.json: 実行タイミングごとの自動処理"
        expression: structure
        data:
          type: tree
          root: ".claude/"
          children:
            - name: "CLAUDE.md — リポジトリ全体の前提・方針"
            - name: "rules/*.md — 条件付きで効かせたい規約"
            - name: "skills/*/SKILL.md — 再利用する作業手順"
            - name: "agents/*.md — 役割特化の Subagent"
            - name: "hooks/*.sh + settings.json — 実行タイミングごとの自動処理"

      - title: "なぜ、リポジトリに置くのか"
        summary: "個人の工夫で終わらせず、チームの資産として共有・改善できるようにするため。"
        content:
          - "チャット履歴に書いた工夫は、他人に渡らず、自分も次回は忘れている"
          - "リポジトリに置けば、差分でレビューでき、他の人が改善を積める"
          - "改善が Pull Request として残るので、なぜそうしたかが追える"
          - "リポジトリを持たない業務でも考え方は同じ — 個人のフォルダに置いても、資産として貯まる"
        expression: bullet
        data: {}

      - title: "歯止め — 権限・コスト・機密"
        summary: "任せる範囲を広げるほど、止め方を先に設計しておく必要がある。"
        content:
          - "権限: 実行を自動許可する範囲を決める。危険操作は必ず確認を挟む"
          - "コスト: 自動で回すものには、反復回数の上限と予算の上限を先に置く"
          - "機密: 顧客情報・認証情報を渡さない。Hook で検出してブロックする"
          - "最後の歯止めは Pull Request — main に入る前に、人が必ず1回見る"
          - "歯止めのない自律化はしない。これは life-os の「ハードストップ」の考え方と同じ"
        expression: bullet
        data: {}

