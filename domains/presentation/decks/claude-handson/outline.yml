  - chapter: "実践 / 複利化サイクルを一周回す"
    slides:
      - title: "実践編 — Skillを作って、育てる。"
        summary: "作って動かすだけで終わらせない。不満を見つけて直すまでが今日の成果物。"
        content:
          - "PRACTICE / Claude Code"
        expression: title
        data: {}

      - title: "実践の進め方と、詰まったときの導線"
        summary: "止まったら手を挙げる。全部できなくても、⑤まで一周することを優先する。"
        content:
          - "前半32分: 棚卸し → Skill作成 → 実行"
          - "後半15分: 不満を挙げる → Skill修正 → 再実行"
          - "詰まったら挙手 — ※リポジトリ確定後に記載（TA体制・質問チャネル）"
          - "時間内に終わらない場合は、Skill の完成度を下げてでも「修正して再実行」まで到達することを優先する"
        expression: comparison
        data:
          mode: table
          axes: ["時間", "やること"]
          columns:
            - { name: "実践0 準備", values: ["5分", "リポジトリを開いて Claude Code を起動する"] }
            - { name: "実践1 棚卸し", values: ["7分", "3回やった作業を書き出し、1つ選ぶ"] }
            - { name: "実践2 Skill作成", values: ["12分", "対話しながら Skill を書く"] }
            - { name: "実践3 実行", values: ["8分", "呼び出して動かし、出力を見る"] }
            - { name: "実践4 不満を挙げる", values: ["5分", "「もっとこうしてほしい」を1つ書く"] }
            - { name: "実践5 修正", values: ["6分", "Skill を直す"] }
            - { name: "実践6 再実行", values: ["4分", "もう一度動かし、差分を確かめる"] }

      - title: "実践0 — リポジトリを開く"
        summary: "同梱の資産を確認して、今日の作業場を立ち上げる。"
        content:
          - "※リポジトリ確定後に記載（リポジトリURL・clone 手順）"
          - "※リポジトリ確定後に記載（同梱されている Skill / Rule / Subagent / Hook の一覧）"
          - "`.claude/` の中を開いて、座学で見た構成が実物としてあることを確認する"
        expression: bullet
        data: {}

      - title: "実践1 — 棚卸し：AI化する作業を1つ選ぶ"
        summary: "loop の燃料は自分の繰り返し作業。まず書き出して、1つに絞る。"
        content:
          - "直近で3回以上やった作業をリストアップする（コードに限らない。調査・資料作成・運用・定型連絡）"
          - "各作業に「手順 / 入力 / 出力 / つまずき」を一言添える"
          - "「面倒・毎回ググる・コピペ」が多いものが良い候補"
          - "1つ選ぶ — 迷ったら「今日の自分が助かるもの」を選ぶ"
        expression: flow
        data:
          type: steps
          orientation: vertical
          steps:
            - label: "書き出す"
              desc: "直近で3回以上やった作業を、思い出せるだけ書き出す"
            - label: "言語化する"
              desc: "各作業に「手順 / 入力 / 出力 / つまずき」を一言添える"
            - label: "絞る"
              desc: "「面倒・毎回ググる・コピペ」が多い作業ほど効果が大きい"
            - label: "1つ選ぶ"
              desc: "迷ったら「今日の自分が助かるもの」を選ぶ"

      - title: "実践2 — Skillを作る"
        summary: "Claude に質問させながら、自分の手順を SKILL.md に書き出す。"
        content:
          - "選んだ作業を Claude に説明する。細かく書かず、まず口頭のつもりで話す"
          - "Claude に質問させて、手順・前提・禁止事項・出力フォーマットを引き出させる"
          - "SKILL.md として書き出させ、すぐ中身を読む — 任せきりにしない"
          - "レビュー観点: 自分の手順が反映されているか／暗黙知が抜けていないか／勝手に足された仕様がないか"
        expression: flow
        data:
          type: steps
          orientation: vertical
          steps:
            - label: "説明する"
              desc: "選んだ作業を、口頭のつもりで Claude に説明する"
            - label: "質問させる"
              desc: "手順・前提・禁止事項・出力フォーマットを Claude に聞き出させる"
            - label: "書き出させる"
              desc: "SKILL.md として書き出させ、.claude/skills/ に配置する"
            - label: "自分で読む"
              desc: "暗黙知の抜けと、勝手に足された仕様がないかを確認する"

      - title: "実践3 — 動かす"
        summary: "作った Skill を実際に呼び出して、狙った作業が完遂できるか確かめる。"
        content:
          - "Skill を名前で呼び出す、または自然文で依頼して発火させる"
          - "出力が「使える」レベルか、あと少しか、まだ遠いかを見る"
          - "うまくいった点・崩れた点をメモする — 次のステップの入力になる"
          - "一発で完璧には動かない。それが正常です"
        expression: bullet
        data: {}

      - title: "実践4 — 不満を1つ挙げる"
        summary: "★ここが人間の仕事★ 出力を見て「もっとこうしてほしい」を言語化する。"
        content:
          - "例: 「前提の確認が浅い」「出力フォーマットが揃わない」「毎回同じ項目を聞き忘れる」"
          - "不満は1つに絞る。全部直そうとすると時間内に一周できない"
          - "書き方: 「現象」「期待」「対応案」の3行で書く"
          - "ここで書いたものが、次の Skill 修正の指示書になる"
        expression: emphasis
        data:
          mode: message
          text: "AIの出力に不満が出たら、直すのはプロンプトではなく“スキル”"

      - title: "実践5 — Skillを直す"
        summary: "プロンプトを工夫するのではなく、SKILL.md に書き戻す。"
        content:
          - "挙げた不満を Claude に渡し、SKILL.md のどこを直すべきか相談する"
          - "「毎回言い忘れる前提」は手順に、「守ってほしい制約」は禁止事項として書き足す"
          - "その場のプロンプトで直すと、次回また同じことを言う羽目になる"
          - "書き戻した瞬間に、その改善は資産になる"
        expression: bullet
        data: {}

      - title: "実践6 — もう一度動かす"
        summary: "1周目との差分を見る。これが「複利化」の実感。"
        content:
          - "同じ依頼をもう一度出し、出力を1周目と並べて比べる"
          - "改善されていれば、あなたはもう複利化サイクルを一周している"
          - "改善されていなければ、直す場所が違った — それも学び。もう一度④に戻る"
          - "余裕があれば、次の不満を1つ挙げて2周目に入る"
        expression: comparison
        data:
          mode: two-column
          left:
            label: "1周目の出力"
            items:
              - "手順は動くが、聞き漏らしがある"
              - "フォーマットが揃わない"
          right:
            label: "2周目の出力"
            items:
              - "書き足した前提を、聞かなくても踏まえている"
              - "フォーマットが安定する"

      - title: "実践まとめ — いま、一周した"
        summary: "作業を見つけ、書き出し、動かし、不満を見つけ、直した。これが複利化サイクル。"
        content:
          - "① 作業を見つけた → ② Skill に書き出した → ③ 動かした → ④ 不満を見つけた → ⑤ 直した"
          - "座学で見た図を、いま自分の手で一周した"
          - "この Skill は、明日もう一度使えば、また一段良くなる"
        expression: flow
        data:
          type: cycle
          steps:
            - label: "① 見つける"
              desc: "実践1でやったこと"
            - label: "② 書き出す"
              desc: "実践2でやったこと"
            - label: "③ 実行させる"
              desc: "実践3でやったこと"
            - label: "④ 不満を見つける"
              desc: "実践4でやったこと"
            - label: "⑤ 直す"
              desc: "実践5・6でやったこと"

  - chapter: "クロージング"
