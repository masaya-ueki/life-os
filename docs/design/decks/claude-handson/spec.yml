    - page: 44
      chapter: appendix
      role: Appendix
      message: "プランを Claude の頭からスクリプトへ移す。だから何十エージェントでも破綻しない"
      must_include:
        - "タイトルの材料: Dynamic workflows — Subagent を数十〜数百まとめて走らせる"
        - "何が違うか: Subagent は Claude が1手ずつ次を決める。Workflow は Claude が書いた JavaScript がループと分岐を持ち、途中結果はスクリプト変数に残る。Claude のコンテキストには最終結果だけが返る"
        - "起動のしかた: プロンプトに ultracode と書く、または「ワークフローで」と頼む。実行前に「フェーズ一覧」が出るので承認して走らせる"
        - "まず試すなら: /deep-research <調べたいこと>（標準搭載）"
        - "コスト注意: 1回で通常会話よりかなり多くトークンを使う。まず狭い範囲（1ディレクトリ）で試す"
      notes: |
        /deep-research は複数の観点でWeb検索を並列に走らせ、出典を突き合わせ、裏が取れなかった主張を落として引用付きレポートにする。
        効く場面: コードベース全体のバグ一掃 / 500ファイルの一括移行 / PR全ファイルのレビューを1本のサマリに集約 / 型チェックが通るまで直し続ける — 「Subagent 数個では足りない」規模。
        資産にする: /workflows で走行中を見られる（進捗・トークン・停止）。良かった run は s キーで .claude/workflows/ に保存すると /<名前> で再実行できる。プラグインに同梱してチーム配布も可能。
        規模の目安: 既定の規模ガイドラインは medium（15エージェント未満目安）で /config から変更可。上限は同時16・1 run あたり1,000エージェント。25エージェント超で警告が出る。
        スクリプトは Claude が書く。
      avoid: []
      speaker_notes: "プランをスクリプトに移す。コストが大きいので狭い範囲から試す。"
