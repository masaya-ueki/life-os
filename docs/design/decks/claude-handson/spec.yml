        実際のイメージ（例）:
          my-plugin/
          ├── .claude-plugin/plugin.json      # 必須（name / description / version）
          ├── skills/review-pr/SKILL.md
          ├── agents/code-reviewer.md
          ├── hooks/hooks.json
          └── .mcp.json
          claude --plugin-dir ./my-plugin     # ローカルで試す
          claude plugin marketplace add my-team/plugin-marketplace
          claude plugin install my-plugin
        作り方の詳しい手順は Appendix（p41・p42）で扱う。
      avoid:
