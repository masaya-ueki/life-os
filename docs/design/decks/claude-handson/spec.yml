# ==============================================================
# Claude Design スライド指示書: Claude ハンズオン「AI駆動で、業務をやる。」
#
# 形式: 主張＋材料＋資料タイプ別の型（ADR-0017）
# Claude Design に渡すもの:
#   1. この spec.yml
#   2. docs/design/design-system-notion-like.md（design_system.source）
#   3. .claude/skills/slide-spec-writer/references/deck-types/handson.md（deck_type: handson の型。他の型は渡さない）
#   4. materials に書いたファイル
#
# 旧形式（完成文＋ページテンプレート）との比較は人間が Claude Design で行う。
# 旧形式の指示書は main の履歴に残っている。
# ==============================================================

meta:
  title: "AI駆動で、業務をやる。"
  subtitle: "Claude ではじめる、自分の作業のAI化ハンズオン"
  purpose: "参加者が「自分の作業をAIに任せる型」を持ち帰る。Skillを1つ作り、実行し、不満を書き戻して再実行するまでを一周体験させる"
  audience: "社内メンバー（Claude Desktop の Code タブで Claude Code を使う。エンジニア以外も含む）"
  tone: "落ち着いた・事実ベース・装飾過多にしない"
  language: ja
  aspect_ratio: "16:9"
  delivery: "画面投影"

# --------------------------------------------------------------
# デザインシステム（参照のみ）
# --------------------------------------------------------------
design_system:
  source: "docs/design/design-system-notion-like.md"
  overrides: {}

# --------------------------------------------------------------
# 全体構成
#
# 時間配分（合計90分）:
#   座学     33分 / opening〜summary（うちデモ 3分）
#   実践     47分 / practice
#   振り返り 10分 / closing
#   Appendix  投影しない / appendix（より学習したい人向けの持ち帰り資料）
#             ※Routines と Artifacts はスライド化せず口頭で触れる方針
#
# ハンズオン教材:
#   JMASystems/all_common_ai_handson（private）。受講者には Zip で配布し、Git / GitHub は使わない。
#   Claude Desktop の Code タブで教材フォルダを開いて実施する。
#   実践は同梱の issue-management（Agent）に作業を説明し、Skill / rule / Agent / Hook を生成させる。
#   冒頭デモは同梱サンプル meeting-task-extraction 一式（Agent / rule / Skill）と sample/meeting/デモ用議事録.vtt。
#   用語: 教材は「Agent」「rule」表記。スライドは部品名を「Subagent」「Rule」とし、実物のフォルダ名（agents/ rules/）で橋渡しする。
#
# 未確定:
#   「※運営確定後に記載」は TA 体制・質問チャネル・登壇者名・開催日。
# --------------------------------------------------------------
deck:
  deck_type: handson
  max_pages: 44
  chapters:
    # 座学（opening〜summary）は合計 33分。章ごとの内訳は未確定のため minutes を書かない
    - { id: opening,  title: "オープニング（表紙〜デモ）",   max_pages: 5 }
    - { id: l01,      title: "L01 AI駆動の現在地",           max_pages: 5 }
    - { id: l02,      title: "L02 Claudeを構成する部品",     max_pages: 10 }
    - { id: l03,      title: "L03 どこに置くか",             max_pages: 4 }
    - { id: summary,  title: "ここまでの整理",               max_pages: 1 }
    - { id: practice, title: "実践",                         max_pages: 10, minutes: 47 }
    - { id: closing,  title: "クロージング",                 max_pages: 2,  minutes: 10 }
    - { id: appendix, title: "Appendix（投影しない）",       max_pages: 7 }

# --------------------------------------------------------------
# 全ページ共通の制約
# --------------------------------------------------------------
constraints:
  ng_source: "docs/design/design-system-notion-like.md#7-dos-and-dontsガードレール"

  # 資料全体で書いてはいけないこと
  avoid:
    - "「loop駆動」「複利化」という語（段階名は「ループ化」に統一する）"
    - "部品名としての「Agent」（「Subagent」に統一する。教材のフォルダ名 agents/ を示すのはよい）"
    - "「Instruction」という語（「Rule」に統一する）"
    - "GitHub Copilot を前提にした記述（対象は Claude のみ）"
    - "実践手順に clone / fork / Pull Request を書くこと（教材は Zip 配布・Git 不使用）"
    - "デモの裏側に MCP / Hook を使ったと書くこと（実物は gh CLI と承認ゲート。Hook は意図的に置いていない）"
    - "SharePoint のURL・社内リポジトリのURL・会社アカウントの手順など、社内情報の具体値"

  checklist:
    - "各ページの message だけを順に読んで筋が通るか"
    - "各ページの must_include がすべて入っているか"
    - "章ごとのページ数が max_pages 以内か（分割でページを増やしていないか）"
    - "全ページに講師メモ（speaker_notes）が入っているか"
    - "強調ページが p2 と p32 の2回だけか"
    - "p8 と p35 のサイクル図が同じ形で描かれているか（p35 は p8 の再掲）"
    - "p5 のデモ画面が p20 で再掲されているか"
    - "図表の色が正本の図表 3 色ルールに収まっているか"

# --------------------------------------------------------------
# 素材
# --------------------------------------------------------------
materials:
  - path: "materials/ハンズオン_生成AI活用推進.pptx"
    kind: "document"
    used_by: []
    note: "旧版（GitHub Copilot 前提・全30枚）。本指示書の元ネタ。デザインは踏襲せず、内容の参照のみに使う"
  - path: "materials/ハンズオン_生成AI活用推進2.pptx"
    kind: "document"
    used_by: []
    note: >-
      型（deck-types/handson.md）の根拠。Claude Design で作って配布した版。
      社内情報を含むためリポジトリへのコミットは保留中（公開リポジトリ）。手元のファイルを Claude Design に渡す。
      事実はこの spec.yml を優先する（この版の「MCP 経由で起票」「git clone」「リポジトリ確定後に記載」は古い記述なので採らない）
  # TODO: p5 のデモ画面スクリーンショットを撮ったら materials/demo-*.png として追加し、
  #       used_by: [5, 20] で参照する（p20 の回収に必須）
  # TODO: 実践ページ（p28〜p34）の操作画面のスクリーンショットがあれば materials/practice-*.png として追加する

# --------------------------------------------------------------
# 内容
# --------------------------------------------------------------
content:
  raw_input: |
    旧版 pptx（materials/ハンズオン_生成AI活用推進.pptx・全30枚・GitHub Copilot 前提）を
    起点に、対象を Claude のみへ変更し、別途実施したレビュー指摘を反映して再構成したもの。

    主な変更:
    - 対象ツールを Claude（Claude Code）のみに変更。Copilot 前提の記述と
      Appendix「Claude Code 対応表」を全廃
    - 合計90分（座学33分 / 実践47分 / 振り返り10分）に再配分
    - 段階名「loop駆動」を廃止し「ループ化」に統一。業界呼称は注記で残す
    - 部品名 Agent → Subagent（段階名との用語衝突を解消）
    - Instruction → Rule（.claude/rules/）に統一
    - 部品に MCP / Plugin を追加（旧版は4点セットのみ）
    - ループ化サイクル（5ステップ）を独立ページに昇格
    - 事前確認 / トリガー早見表 / 歯止め / 成果物イメージ / クロージングを新設
    - 実践を「作る→動かす→不満→修正→再実行」の2周構成に再設計

    ハンズオン教材（JMASystems/all_common_ai_handson）の実物に合わせて反映したこと:
    - 配布は Zip・Git 不使用・Claude Desktop の Code タブで教材フォルダを開く（p4 / p28）
    - デモは同梱サンプル meeting-task-extraction（.vtt → 抽出 → 一括承認 → gh で Draft item 登録）。
      MCP・Hook は使っていないため、p5 / p17 / p20 の説明を実物に揃えた
    - 実践は issue-management に作業を説明し、5ステップの聞き取りで成果物を生成（モード A）、
      不満を伝えて差分更新（モード B）。変更履歴が残らないため変更サマリをメモする（p30-34）

    新形式（ADR-0017）への書き換えで変えたこと:
    - Skill の説明を2ページ（①2種類 / ②今日作るのはこれ）から1ページに統合した（1概念1ページ）。
      以降のページ番号が1つずつ繰り上がり、全45ページ → 44ページ
    - 部品の説明ページ（Skill / Rule / Subagent / Hook / MCP / Plugin）は、
      配布版（ハンズオン_生成AI活用推進2.pptx）の「なぜ必要か → 概要 → 実際のイメージ」を材料に加えた

  pages:

    # ============================================================
    # オープニング（p1-5 / 約7分・うちデモ3分）
    # ============================================================

    - page: 1
      chapter: opening
      role: 表紙
      message: "Claude に業務を任せる方法を、手を動かして身につけるハンズオンである"
      must_include:
        - "タイトル: AI駆動で、業務をやる。"
        - "対象の部品: Skill / Rule / Subagent / Hook / MCP / Plugin"
        - "開発に限らず、すべての業務が対象"
        - "日付: 2026-06-23"
        - "登壇者: ※運営確定後に記載（登壇者名）"
      notes: |
        種別ラベルの材料: AI-DRIVEN WORK / Hands-on。
        サブタイトルの材料: 「開発」を超えて、すべての業務をAI駆動に。
        合計90分のハンズオン。
      avoid: []
      speaker_notes: "表紙。開始の挨拶と、90分の枠組みだけ伝える。"

    - page: 2
      chapter: opening
      role: 強調
      message: "今日持ち帰るのは「自分の作業をAIに任せる型」"
      must_include:
        - "作って終わりではなく、出力への不満を Skill に書き戻すところまで一周する"
      notes: |
        本番は持ち帰ってから。自分の仕事で回し続けることが本当の目的で、今日はその一周目を体験する場。
        強調ページは資料全体で2回だけ（このページと p32）。
      avoid:
        - "持ち帰るものを2つ以上並べる"
      speaker_notes: "強調1回目。作って終わりではない、という一点だけ置く。"

    - page: 3
      chapter: opening
      role: 流れと時間
      message: "90分のうち47分を実践に使い、修正して再実行するところまでやる"
      must_include:
        - "座学 33分: AI駆動の現在地 / Claudeを構成する部品 / どこに置くか"
        - "実践 前半 32分: 棚卸し → Skill作成 → 実行"
        - "実践 後半 15分: 不満を挙げる → Skill修正 → 再実行"
        - "振り返り 10分: 成果物の確認 / 明日やる1つ / 次のリソース"
        - "合計 90分"
      notes: |
        実践は「作って終わり」にしない。修正して再実行するところまでを47分に含む。
      avoid: []
      speaker_notes: "時間配分を明示。実践に47分取ることを強調する。"

    - page: 4
      chapter: opening
      role: 事前準備
      message: "実践の前に、全員の環境が動く状態かを確かめる"
      must_include:
        - "Claude Desktop: インストール済みでログインでき、画面上部の Code タブが開ける"
        - "教材フォルダ: 配布 Zip を展開済みで、隠しフォルダ .claude が見えている（Windows は「表示 → 隠しファイル」をオン）"
        - "起動確認: Code タブで教材フォルダを選び、左隣が「ローカル」と表示され、対話できる"
        - "動いていない人はこの時点で挙手 — 実践が始まる前に解消する"
      notes: |
        ここで詰まると実践47分が丸ごと溶ける。先に全員の環境を揃えるのが狙い。
        フォルダを選ぶときは、展開した一番上のフォルダではなく .claude がある階層（all_common_ai_handson）を選ぶ。
      avoid:
        - "git clone など Git を使う取得手順"
        - "SharePoint の場所や会社アカウントのサインイン手順などの社内情報"
      speaker_notes: "ハンズオン開始前に各自で確認してもらう。フォルダの階層（.claude がある階層を選ぶ）に注意させる。動かない人はここで挙手。"

    - page: 5
      chapter: opening
      role: デモ
      message: "Claude に任せると、人は「渡す」と「承認する」だけになる"
      must_include:
        - "題材: Teams の文字起こし（.vtt）。教材同梱の sample/meeting/デモ用議事録.vtt"
        - "流れ: 渡す → 抽出する → 承認する → 登録する"
        - "抽出: 「誰が・いつまでに・何をするか」を拾う。担当や期限が読み取れないものは推測せず「確認待ち」に分ける"
        - "承認: 登録予定の一覧を人が見て、除外・修正を指示してから承認する"
        - "登録: 承認された分だけを GitHub Project にタスクとして登録する"
        - "予告: この裏側は部品の組み合わせでできている。座学の後半（p20）で分解する"
        - "デモ画面のスクリーンショット（TODO: materials に追加予定）"
      notes: |
        完成形を先に見せるページ。3分のデモ。
        人の関与は最初（渡す）と途中（承認する）だけで、それ以外は Claude がやる。
      avoid:
        - "MCP 経由で登録したと書く（実物は gh コマンド）"
        - "議事録化してから起票する流れとして書く（実物は .vtt から直接タスクを抽出する）"
        - "ここで裏側の部品を説明する（p20 で回収する）"
      speaker_notes: "3分デモ。裏側の説明はここではしない。p20で回収する。"

    # ============================================================
    # L01 AI駆動の現在地（p6-10 / 約9分）
    # ============================================================

    - page: 6
      chapter: l01
      role: 章扉
      message: "「AIにコードを書かせる」段階は終わり、「AIに仕事を任せて、育てる」段階へ"
      must_include:
        - "章番号: L01"
        - "章タイトル: AI駆動の現在地"
      notes: ""
      avoid: []
      speaker_notes: "章扉。ここから座学の1章目。"

    - page: 7
      chapter: l01
      role: 要点
      message: "AI活用は4段階あり、人の関与が「やる」から「設計する」に変わる"
      must_include:
        - "手動: 自分で書く。AIは介在しない"
        - "補助: 補完・チャットで聞く。人が主役、AIは助手"
        - "エージェント駆動: タスクごと任せて、人はレビューする"
        - "ループ化: スキルを書いて回す。やるほど次が楽になる"
        - "本日のゴール: エージェント駆動を身につけ、ループ化の入り口に立つこと"
      notes: |
        4段階は順序に意味がある。注目させるのは4段階目のループ化（今日向かう先）。
      avoid:
        - "「loop駆動」と書く"
      speaker_notes: "4段階。本日のゴールは3段目を身につけ、4段目の入り口に立つこと。"

    - page: 8
      chapter: l01
      role: 要点
      message: "AIの出力に不満が出たら、直すのはプロンプトではなく“スキル”"
      must_include:
        - "キーフレーズ（原文どおり）: AIの出力に不満が出たら、直すのはプロンプトではなく“スキル”"
        - "ループ化サイクルの5ステップ: ①見つける → ②書き出す → ③実行させる → ④不満を見つける → ⑤直す → ①へ戻る"
        - "①見つける: 自分が繰り返しやっている作業を見つける"
        - "②書き出す: 手順を Skill / Subagent として書き出す"
        - "③実行させる: AI に実行させ、成果物を生成させる"
        - "④不満を見つける: 出力を見て「もっとこうしてほしい」を1つ見つける（人がやる）"
        - "⑤直す: プロンプトではなく Skill を直し、①へ戻る"
        - "業界呼称: Compounding Engineering / Loop Engineering。life-os リポジトリでは「Loop Engineering」と呼び、その中身がこのループ化サイクル"
      notes: |
        今日の背骨になる最重要ページ。終わりが始まりに戻る循環であることが伝わる必要がある。
        人の仕事は④だけ。p35（実践まとめ）で同じ図を再掲し、実践番号を重ねる。
      avoid:
        - "「loop駆動」「複利化」と書く"
      speaker_notes: "★最重要。ここが今日の背骨。④だけが人の仕事だと強調する。p35で再掲する。"

    - page: 9
      chapter: l01
      role: 要点
      message: "変わるのは人の役割で、実装者から設計者・レビュアーになる"
      must_include:
        - "これまで（実装者）: 自分で手順を実行する / 「どう書くか」を考える / 対象は自分の担当領域"
        - "これから（設計者・レビュアー）: 任せる形を設計し、結果を確かめる / 「何を任せ、どう確かめるか」を考える / 対象は調査・資料作成・運用まで全業務"
        - "差がつくのは「何を任せるか」の設計と、そのための資産づくり"
      notes: |
        これまでとこれからの項目は対応させて並べる。
      avoid: []
      speaker_notes: "実装者からレビュアーへ。対象が全業務に広がる点を押す。"

    - page: 10
      chapter: l01
      role: 要点
      message: "3回やったら、AI化。「面倒・毎回ググる・コピペ」を感じた瞬間がシグナル"
      must_include:
        - "タイトル（原文どおり）: 3回やったら、AI化。"
        - "繰り返しに気付く: 「手動で繰り返している作業はないか？」を常に問う"
        - "手順が固まっている: 3回以上やった作業は、既に仕組み化できるだけ手順が固まっている"
        - "効果が大きい候補: 「面倒・毎回ググる・コピペ」が多い作業ほど効果が大きい"
      notes: |
        「面倒」を感じた瞬間こそ、AI化のシグナル。実践1（棚卸し）の選び方にそのまま使う基準。
      avoid: []
      speaker_notes: "実践1の棚卸しに直結する基準。ここを覚えて帰ってもらう。"

    # ============================================================
    # L02 Claudeを構成する部品（p11-20 / 約14分）
    # ============================================================

    - page: 11
      chapter: l02
      role: 章扉
      message: "CLAUDE.md を土台に、6つの部品を積み上げるほど任せられる範囲が広がる"
      must_include:
        - "章番号: L02"
        - "章タイトル: Claude を構成する部品"
      notes: ""
      avoid: []
      speaker_notes: "章扉。部品の話に入る。作るのはSkillだけ、と先に言う。"

    - page: 12
      chapter: l02
      role: 要点
      message: "1つの共通方針と6種のAI資産が積み上がっている。今日作るのは Skill で、残りはこの先の地図"
      must_include:
        - "土台 CLAUDE.md: 全セッションで常時ロードされる、リポジトリ全体の前提と方針"
        - "手順と規約: Skill / Rule — やり方と守ることを渡す"
        - "分業と歯止め: Subagent / Hook — 仕事を分け、実行に歯止めをかける"
        - "接続と配布: MCP / Plugin — 外部ツールにつなぎ、作った資産を配る"
      notes: |
        下の層が上の層を支える関係。土台が CLAUDE.md。
        身近なたとえ（部品ごと。各説明ページで使う）:
        - CLAUDE.md = 必ず見る規則。就業規則や事業説明のようなもの
        - Skill = 手順書。背表紙だけ常に見えていて、必要なときだけ抜き出す
        - Subagent = 担当者。別の人に作業を振って、結果だけ報告してもらう
        - Hook = 任意のタイミングで必ずやること。作業の前に必ず手を洗う
        - MCP = 他サービスとの接続。AIにアカウントを発行して GitHub などに問い合わせできるようにする
        - Plugin = 上記一式を詰めたセット。部門共通にして配りたいときに使う
      avoid:
        - "部品を上下関係のない横並びとして書く"
      speaker_notes: "下の層が上の層を支える。今日作るのはSkillだけで、残りは地図。"

    - page: 13
      chapter: l02
      role: 説明
      message: "Skill は、毎回貼り直している手順や規約を SKILL.md に切り出し、必要なときだけ Claude に読ませる仕組み。今日作るのはこれ"
      must_include:
        - "置き場所: .claude/skills/<名前>/SKILL.md"
        - "2種類: リファレンス型（判断に使う知識。例: API規約・スタイルガイド・命名規則）/ アクション型（手順そのもの。例: 議事録作成・リリース手順）"
        - "今日作るのはアクション型"
        - "SKILL.md に書くこと: いつ使うか / 手順 / 守ること"
        - "教材のサンプル: .claude/skills/meeting-task-extraction/SKILL.md（冒頭デモの手順）"
      notes: |
        なぜ必要か（読み手の困りごと）:
        - レビュー観点・規約・手順を、毎回チャットに貼り直している
        - かといって CLAUDE.md に全部書くと肥大化し、無関係な作業でも常にトークンを食う
        - 人によって指示の書き方がバラバラで、出力品質が安定しない
        - 手順を更新しても各自のメモに散っていて、周知できない
        一言の定義: 手順書・規約を SKILL.md に切り出し、必要なときだけ Claude に読み込ませる仕組み。
        特徴:
        - 自動発火: Claude が「今これが要る」と判断したときだけ読む。呼ばれるまでのコンテキストコストはほぼゼロ
        - 明示呼び出し: 名前で直接呼べる（/skill-name）。自然文で依頼しても発火する
        - 段階的な開示: 詳細は別ファイルに分けて SKILL.md からリンクし、必要になったときだけ開かせる
        作り方の流れ: いつ使うかを書く → 自分が普段やっている順番を箇条書きにする → 禁止事項・前提・出力フォーマットなど外してほしくない条件を書く → 呼び出して試し、出力を見て書き足す。
        題材の例: 月次の売上レポート作成（CSV 取得 → 集計 → グラフ → メール送信）。
        守ってほしい制約は rule に分けて書いてもよい。
        Subagent との違い: Skill はコンテキストに載るので AI は「知っている」状態で作業できる。Subagent はコンテキストを分離して要約だけ返す。
        身近なたとえ: 手順書。背表紙だけ常に見えていて、必要なときだけ抜き出す。
        実際のイメージ（例。教材サンプル meeting-task-extraction の SKILL.md を見せてもよい）:
          ---
          name: summarize-changes
          description: 変更内容を要約してリスクを指摘する。差分レビュー時に使う
          ---
          ## 指示
          変更内容を 2〜3 行で要約し、次の観点でリスクを列挙すること:
          - エラーハンドリングの漏れ
          - ハードコードされた値・秘匿情報
        （frontmatter の description が「いつ使うか」、本文が手順と守ること、という対応が分かればよい）
      avoid:
        - "Skill を2ページに分ける"
        - "スラッシュコマンドでしか呼べないように書く"
      speaker_notes: "Skillは2種類。今日作るのはアクション型。SKILL.md は「いつ使うか・手順・守ること」を書くだけで作れる、と伝える。"

    - page: 14
      chapter: l02
      role: 説明
      message: "rules/ はテーマごとに分けた CLAUDE.md。paths を書けば効かせる範囲を絞れる"
      must_include:
        - "置き場所: .claude/rules/"
        - "CLAUDE.md: 全セッションで常時ロード / リポジトリ全体の前提・方針"
        - "rules/（paths なし）: 全セッションで常時ロード / テーマ別に分けたい規約（例: 承認ゲート・個人情報）"
        - "rules/（paths あり）: paths に一致するファイルを読んだときだけロード / 特定のファイル種別・領域にだけ効かせたい規約"
        - "経験則: CLAUDE.md は200行以下に保つ。超えたら rules/ か Skill に逃がす"
      notes: |
        なぜ必要か（読み手の困りごと）:
        - CLAUDE.md に何でも書いていくと長くなり、読ませたい規約が埋もれる
        - 特定のファイル種別にしか関係ない規約まで、無関係な作業で常に読まれる
        - 規約がテーマごとに分かれておらず、どこを直せばよいか分からない
        一言の定義: テーマや対象ファイルごとに分けて置く、CLAUDE.md の分冊。
        特徴: テーマごとにファイルを分けられる / paths で効かせる範囲を絞れる / 常時ロードの CLAUDE.md を短く保てる。
        実際のイメージ: 教材の rules/meeting-task-extraction.md（承認なしに書き込まない・推測しない・個人情報を出さない）。
        身近なたとえ: 就業規則（CLAUDE.md）に対する、業務ごとの細則。
        教材の表記は「rule」。スライドでは「Rule」と書き、フォルダ名 rules/ で橋渡しする。
      avoid:
        - "「Instruction」と書く"
      speaker_notes: "CLAUDE.md を分冊にしたものが rules/。paths を書くと必要なときだけ読まれる。CLAUDE.md は200行以下が目安。"

    - page: 15
      chapter: l02
      role: 説明
      message: "Subagent は独自のコンテキストを持つ役割別の分身で、本体の会話を汚さずに分業させられる"
      must_include:
        - "置き場所: .claude/agents/"
        - "Skill: 再利用可能な指示・知識・ワークフロー / コンテキスト全体で内容を共有 / リファレンス、呼び出し可能なワークフロー向き"
        - "Subagent: 独自コンテキストを持つ独立ワーカー / コンテキスト分離。サマリーのみ返る / 多ファイル読み込み、並列作業、専門ワーカー向き"
        - "発展形: Agent teams（独立セッション同士が直接メッセージし合い、共有タスクリストで自己調整する）。※実験的機能・デフォルト無効"
      notes: |
        なぜ必要か（読み手の困りごと）:
        - 調査や検索の結果でメインの会話が埋まり、本題の文脈が押し出される
        - 「レビューして」と頼んだだけなのに、勝手に書き換えられる
        - 毎回「あなたはシニアレビュアーです…」と役割設定を書き直している
        - 軽い作業にも重いモデルが使われて、コストが読めない
        一言の定義: 独立したコンテキストで動く、役割・ツール・モデルを固定した専門ワーカー。
        特徴:
        - コンテキストが分離される: 作業の詳細は Subagent 側に閉じ、メインには要約だけが返る
        - 会話履歴は引き継がれない: 渡るのはシステムプロンプト＋依頼内容＋CLAUDE.md 程度。ここが Skill との決定的な差
        - 呼び出し: description による自動委任 / 明示指名 / claude --agent <名前>
        身近なたとえ: 担当者。別の人に作業を振って、結果だけ報告してもらう。レビューのように作成者本人にやらせないほうがよい作業を任せる。
        実際のイメージ（例）:
          ---
          name: code-reviewer
          description: 変更後に品質・セキュリティ観点でレビューする。実装が一段落したら使う
          tools: Read, Grep, Glob        # ← 書き込み系は渡さない ＝ 壊せない
          model: sonnet
          ---
          あなたはシニアレビュアーです。可読性 / セキュリティ / 既存パターンとの一貫性の観点で指摘してください。
          各指摘は「問題点 → なぜ問題か → 修正案」の形で示すこと。
        教材では冒頭デモの agents/meeting-task-extractor.md が Subagent の実例。
      avoid:
        - "部品名を「Agent」と書く（段階名「エージェント駆動」と衝突するため）"
      speaker_notes: "Skill は会話に載る、Subagent は別のコンテキストで動いて要約だけ返す。この差だけ押さえてもらう。Agent teams は実験的機能として一言触れる程度。"

    - page: 16
      chapter: l02
      role: 説明
      message: "「毎回聞かれずに、必ず実行してほしい」ことを Hook にする。人が見ていなくても効く唯一の部品"
      must_include:
        - "実行のタイミング: 実行前（危険な操作をブロック・実行内容を検査）/ 実行中（監査ログ・外部へ通知）/ 実行後（フォーマッタやテストを自動実行）/ セッション終了時（結果をまとめる・後片付け）"
        - "実行できるもの: シェルコマンド / HTTPリクエスト / MCPツール / LLMプロンプト / subagent"
        - "設定の置き場所: .claude/settings.json（スクリプトは .claude/hooks/）"
      notes: |
        なぜ必要か（読み手の困りごと）:
        - 「作業の前に必ずチェックして」と CLAUDE.md に書いても、守られる保証がない
        - 危険な削除や本番環境への接続を、確実に止めたい。「たぶん止まる」では困る
        - 監査ログを残したいが、AI の気分に依存させたくない
        - フォーマッタの実行を毎回お願いするのが面倒
        一言の定義: 決まったタイミングで必ず実行される処理。AI の判断を通らない、確定的な制御。
        特徴:
        - ツール実行の前に割り込める: 許可・拒否・入力の書き換えまでできる
        - 主なイベント: PreToolUse / PostToolUse / UserPromptSubmit / Stop / SessionStart・SessionEnd など
        - プラグインに同梱もできる（hooks/hooks.json）
        身近なたとえ: 作業の前に必ず手を洗う。
        実際のイメージ（例。コマンド実行の直前にガードを挟む）:
          .claude/settings.json
          { "hooks": { "PreToolUse": [{ "matcher": "Bash",
              "hooks": [{ "type": "command", "command": "${CLAUDE_PROJECT_DIR}/.claude/hooks/guard.sh" }] }] } }
          .claude/hooks/guard.sh（破壊的コマンドを拒否する）
          CMD=$(jq -r '.tool_input.command')
          if echo "$CMD" | grep -q 'rm -rf'; then
            echo "破壊的コマンドは禁止されています" >&2
            exit 2   # ← 2 = ブロック
          fi
          exit 0
          終了コード: 0 = 通過 / 1 = 非ブロックのエラー（処理は続行）/ 2 = ブロック
        注意（1つ）: 「守らせたい」なら Hook。Skill と Subagent は結局プロンプトなので確実性を要求してはいけない。逆に、判断が必要なことを Hook に押し込むのも誤り。
      avoid:
        - "冒頭デモで Hook を使ったと書く（教材は Hook を意図的に置いていない）"
      speaker_notes: "Hook は AI の判断を通らずに必ず動く。守らせたいことは Hook、判断が要ることは Skill / Subagent、という使い分けを一言で。"

    - page: 17
      chapter: l02
      role: 説明
      message: "見えないツールの情報をコピペし続けるのをやめ、MCP で AI を外部ツールに直接つなぐ"
      must_include:
        - "接続先の例: GitHub（Issue / PR / Projects）/ Notion（ページ・DBの検索と更新）/ その他の社内ツール・SaaS（MCP サーバーが提供されているもの）"
        - "冒頭デモの登録は gh コマンドで行っている。MCP にすれば同じことを専用ツールとして呼べる"
        - "Teams のトランスクリプトはファイルとして渡している（公式 MCP が使えるとは限らないため）"
      notes: |
        なぜ必要か（読み手の困りごと）:
        - Issue もチャットのログも社内 DB も AI からは見えないので、人がコピペして貼っている
        - サービスごとに独自の繋ぎ込みを書くと、ツールの数だけ実装が増える
        - API キーの扱いが人によってバラバラで、リポジトリに混入する事故が起きる
        一言の定義: AI と外部サービスをつなぐオープンな共通プロトコル。
        特徴:
        - サーバーが提供するもの: Tools（呼べる関数）/ Resources（データへの参照）/ Prompts（テンプレート）
        - つなぎ方: http（リモート・推奨）/ stdio（ローカルプロセス）
        - 認証: OAuth（ブラウザでサインイン）/ トークン / 環境変数
        身近なたとえ（どちらか1つ）: USB-C 端子 / AI にアカウントを発行して他サービスに問い合わせできるようにする。
        実際のイメージ（例）:
          # リモート（HTTP）
          claude mcp add --transport http notion https://mcp.notion.com/mcp
          # 認証が要るサーバーはセッション内で /mcp → サーバーを選択 → Authenticate
          .mcp.json（プロジェクト直下）
          { "mcpServers": { "notion": { "type": "http", "url": "https://mcp.notion.com/mcp" } } }
        TIPS（1つ）: CLI で追加すると設定ファイルに書き込まれる。チームで揃えたいものは --scope project（.mcp.json）へ、自分だけのものは既定の local のままにする。
      avoid:
        - "冒頭デモのタスク登録を MCP で行ったと書く（実物は gh コマンド）"
        - "API キーを設定ファイルに直書きする例を載せる"
      speaker_notes: "MCP は AI を外のツールにつなぐ共通の端子。冒頭デモは gh コマンドで登録していて MCP ではない、と正確に言う。"

    - page: 18
      chapter: l02
