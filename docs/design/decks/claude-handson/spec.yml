# ==============================================================
# Claude Design スライド指示書: Claude ハンズオン「AI駆動で、業務をやる。」
# 使い方: このYAMLと design_system.source のファイル、materials/ を Claude Design に渡す
# ==============================================================

meta:
  title: "AI駆動で、業務をやる。"
  subtitle: "Claude ではじめる、自分の作業のAI化ハンズオン"
  purpose: "参加者が「自分の作業をAIに任せる型」を持ち帰る。Skillを1つ作り、実行し、不満を書き戻して再実行するまでを一周体験させる"
  audience: "社内メンバー（Claude Code 利用者。エンジニア以外も含む）"
  tone: "落ち着いた・事実ベース・装飾過多にしない"
  language: ja
  aspect_ratio: "16:9"
  slide_size: { w: 1920, h: 1080 }
  page_count: 45
  delivery: "画面投影"

# --------------------------------------------------------------
# デザインシステム（共通・全ページ適用）
# --------------------------------------------------------------
design_system:
  source: "docs/design/design-system-notion-like.md"

  # 図表3色ルール（割り付け時の判断メモ）
  #   1色目 accent      = 今日の到達点・人がやること・注目ステップ
  #   2色目 text_muted  = 比較対象・過去の姿
  #   3色目 border      = 母数・背景・非注目

  overrides: {}

# --------------------------------------------------------------
# 全体構成
#
# 時間配分（合計90分）:
#   座学     33分 / p1-26（うちデモ 3分）
#   実践     47分 / p27-36
#   振り返り 10分 / p37-38
#   Appendix  投影しない / p39-45（より学習したい人向けの持ち帰り資料）
#
# 用語の方針:
#   「loop駆動」は使わない。段階名は「ループ化」とする。
#   業界呼称（Compounding Engineering / Loop Engineering）は p8 に注記で残し、
#   life-os が正式名として使う「Loop Engineering」への橋渡しを1行入れる。
#   部品名は「Subagent」に統一する（段階名「エージェント駆動」との用語衝突を避けるため）。
#
# 未確定:
#   「※リポジトリ確定後に記載」はハンズオン用リポジトリ（Claude版）の再作成待ち。
# --------------------------------------------------------------
deck:
  flow_pattern: "時系列"   # 研修の進行順（座学 → 実践 → 振り返り）
  pages:
    # --- オープニング（p1-5 / 約7分・うちデモ3分）---
    - { no: 1,  template: T01_title,       note: "表紙" }
    - { no: 2,  template: T14_emphasis,    note: "本日の目的（強調1回目/全2回）" }
    - { no: 3,  template: T02_agenda,      note: "本日の流れ＋時間配分の内訳" }
    - { no: 4,  template: T05_bullets,     note: "事前確認：動く状態か（挙手確認）" }
    - { no: 5,  template: T09_process,     note: "デモ：議事録→タスク化。裏側は後で分解の予告" }

    # --- L01 AI駆動の現在地（p6-10 / 約9分）---
    - { no: 6,  template: T03_section,     note: "章扉：AI駆動の現在地" }
    - { no: 7,  template: T09_process,     note: "AI活用の4段階（手動→補助→エージェント駆動→ループ化）" }
    - { no: 8,  template: T18_cycle,       note: "★最重要 ループ化サイクル（5ステップ）" }
    - { no: 9,  template: T13_before_after, note: "変わるのは人の役割" }
    - { no: 10, template: T05_bullets,     note: "3回やったら、AI化。" }

    # --- L02 Claudeを構成する部品（p11-21 / 約14分）---
    - { no: 11, template: T03_section,     note: "章扉：Claudeを構成する部品" }
    - { no: 12, template: T19_stack,       note: "共通方針＋6種のAI資産（積み上げ）" }
    - { no: 13, template: T07_table,       note: "Skill① リファレンス型/アクション型" }
    - { no: 14, template: T09_process,     note: "Skill② 今日作るのはこれ" }
    - { no: 15, template: T07_table,       note: "Rule（.claude/rules/）" }
    - { no: 16, template: T07_table,       note: "Subagent（+Agent teams 注記）" }
    - { no: 17, template: T09_process,     note: "Hook" }
    - { no: 18, template: T06_cards,       note: "MCP連携" }
    - { no: 19, template: T06_cards,       note: "Plugin / Marketplace" }
    - { no: 20, template: T07_table,       note: "トリガー早見表（記号を使わない対応表）" }
    - { no: 21, template: T05_bullets,     note: "デモの裏側（デモ画面スクショを再掲して回収）" }

    # --- L03 どこに置くか（p22-25 / 約7分）---
    - { no: 22, template: T03_section,     note: "章扉：どこに置くか" }
    - { no: 23, template: T05_bullets,     note: ".claude/ にAI資産を集約する" }
    - { no: 24, template: T04_message,     note: "なぜリポジトリに置くか" }
    - { no: 25, template: T05_bullets,     note: "歯止め（権限・コスト・機密）" }

    # --- 座学まとめ（p26 / 約2分）---
    - { no: 26, template: T15_summary,     note: "ここまでが全員共通＋47分後の成果物イメージ" }

    # --- 実践（p27-36 / 47分）---
    - { no: 27, template: T03_section,     note: "章扉：実践編" }
    - { no: 28, template: T02_agenda,      note: "実践の進め方と、詰まったときの導線" }
    - { no: 29, template: T05_bullets,     note: "実践0 リポジトリを開く（5分）" }
    - { no: 30, template: T09_process,     note: "実践1 棚卸し（7分）" }
    - { no: 31, template: T09_process,     note: "実践2 Skillを作る（12分）" }
    - { no: 32, template: T05_bullets,     note: "実践3 動かす（8分）" }
    - { no: 33, template: T14_emphasis,    note: "実践4 不満を1つ挙げる（5分）★強調2回目/全2回" }
    - { no: 34, template: T04_message,     note: "実践5 Skillを直す（6分）" }
    - { no: 35, template: T13_before_after, note: "実践6 もう一度動かす（4分）" }
    - { no: 36, template: T18_cycle,       note: "実践まとめ：いま一周した（p8の図を再掲し実践番号を重ねる）" }

    # --- クロージング（p37-38 / 10分）---
    - { no: 37, template: T15_summary,     note: "今日、手元に残ったもの" }
    - { no: 38, template: T16_next,        note: "明日やる1つと、次のリソース" }

    # --- Appendix（p39-45 / 本編では話さない。より学習したい人向けの持ち帰り資料）---
    - { no: 39, template: T03_section,     note: "章扉：より学習したい人へ" }
    - { no: 40, template: T07_table,       note: "AI駆動開発環境① 環境を作る（新規 / 既存）" }
    - { no: 41, template: T05_bullets,     note: "AI駆動開発環境② 公式プラグインと参考リポジトリ＋ハンズオン" }
    - { no: 42, template: T07_table,       note: "汎用プラグイン① .claude/ 直置き vs プラグイン化" }
    - { no: 43, template: T09_process,     note: "汎用プラグイン② ハンズオン：チームで共有する" }
    - { no: 44, template: T09_process,     note: "仕様駆動開発（GitHub Spec Kit）＋ハンズオン" }
    - { no: 45, template: T05_bullets,     note: "Routines（定期実行）＋ハンズオン" }

# --------------------------------------------------------------
# ページテンプレート定義
#
# T01-T17 は共通テンプレート。T18/T19 は本案件で追加した。
# --------------------------------------------------------------
page_templates:

  - id: T01_title
    name: 表紙
    use_when: "1枚目"
    layout: |
      +--------------------------------------+
      |                                      |
      |   [label] 案件種別                    |
      |   TITLE（大）                         |
      |   subtitle                            |
      |   ───────────                        |
      |   日付 / 作成者                        |
      +--------------------------------------+
    slots: [eyebrow_label, title, subtitle, date, author]
    rules: ["左下寄せ or 中央。背景は bg。装飾図形は入れない"]

  - id: T02_agenda
    name: 目次
    use_when: "全体像を共有するとき"
    layout: |
      Agenda
      ──────────────────
      01  項目            ─ 補足
      02  項目            ─ 補足
      03  項目            ─ 補足
    slots: ["items[{no, label, note}]"]
    rules: ["4〜6項目。番号は連番が意味を持つ場合のみ", "現在地を示す場合は accent で該当行のみ強調"]

  - id: T03_section
    name: 章扉
    use_when: "話題が切り替わるとき"
    layout: |
      +--------------------------------------+
      |            02                        |
      |            章タイトル                 |
      |            この章で分かること          |
      +--------------------------------------+
    slots: [section_no, section_title, section_lead]
    rules: ["背景 bg_subtle。文字は3行以内"]

  - id: T04_message
    name: メッセージ＋本文（基本形）
    use_when: "説明・主張を1つ伝えるとき"
    layout: |
      page_title
      ──────────────────
      ▍key_message（1〜2行）

      ・根拠1
      ・根拠2
      ・根拠3

      caption / 出典
    slots: [page_title, key_message, "points[]", caption]
    rules: ["根拠は3点まで", "key_message は callout で表現", "本文は1文40字以内"]

  - id: T05_bullets
    name: 要点リスト
    use_when: "並列の情報を列挙するとき"
    layout: |
      page_title
      ──────────────────
      01 見出し  本文…
      02 見出し  本文…
      03 見出し  本文…
    slots: [page_title, "items[{label, body}]"]
    rules: ["3〜5項目。各項目は見出し＋1〜2行", "順序に意味がなければ番号を付けない"]

  - id: T06_cards
    name: 並列カード（3カラム）
    use_when: "同列の選択肢・要素を比較なしで並べるとき"
    layout: |
      page_title
      ──────────────────
      [ card ]  [ card ]  [ card ]
       label     label     label
       body      body      body
    slots: [page_title, "cards[{label, title, body}]"]
    rules: ["2〜4枚。カード内テキストは同じ粒度に揃える", "強調したい1枚のみ accent_soft、他は bg_subtle"]

  - id: T07_table
    name: 比較表
    use_when: "複数案を評価軸で比べるとき"
    layout: |
      page_title
      ──────────────────
      |      | 案A | 案B | 案C |
      | 軸1  |  ○  |  △  |  ×  |
      | 軸2  | ... | ... | ... |
      ──────────────────
      ▍結論（どれを採るか＋理由）
    slots: [page_title, "columns[]", "rows[{axis, values[]}]", conclusion]
    rules:
      - "評価記号は ○ △ × の3段階。色は chart_palette 3色に対応させる"
      - "推奨案の列のみ accent_soft で面塗り"
      - "横罫線のみ。表の下に必ず結論を置く"
      - "本案件の p20 は評価表ではなく対応表のため、評価記号と推奨列の面塗りは適用しない"

  - id: T08_matrix
    name: 2軸マトリクス
    use_when: "ポジショニング・優先度を示すとき"
    layout: |
      page_title
      ──────────────────
          高 |  ②  |  ①  |
             |-----+-----|
          低 |  ④  |  ③  |
              低       高
    slots: [page_title, x_axis, y_axis, "quadrants[{label, items[]}]", takeaway]
    rules: ["注目象限のみ accent。他はグレー", "プロットは最大8点"]

  - id: T09_process
    name: プロセス / ステップ
    use_when: "順序や手順を示すとき（順序に意味がある場合のみ）"
    layout: |
      page_title
      ──────────────────
      ①──────▶②──────▶③──────▶④
      label    label    label    label
      body     body     body     body
    slots: [page_title, "steps[{no, label, body, owner, due}]"]
    rules: ["3〜5ステップ。矢印は border 色の細線", "現在地/次アクションのみ accent"]

  - id: T10_chart
    name: グラフ＋示唆
    use_when: "数値で語るとき"
    layout: |
      page_title
      ──────────────────
      [ graph            ]  ▍示唆
                            ・読み取り1
                            ・読み取り2
      caption（出典・期間）
    slots: [page_title, "chart{type, x, series[]}", insight, "points[]", caption]
    rules:
      - "グラフは1ページ1つ。系列は3つまで（chart_palette準拠）"
      - "凡例より直接ラベル。グリッド線は最小限、枠線なし"
      - "注目させたい系列のみ accent、他は grey/light"
      - "出典と期間を caption に必ず記載"

  - id: T11_kpi
    name: 数値ハイライト
    use_when: "インパクトのある数字を見せるとき"
    layout: |
      page_title
      ──────────────────
       1,240      ▲12%      3.5h
       label      label     label
      ──────────────────
      ▍この数字が意味すること
    slots: [page_title, "metrics[{value, unit, label, delta}]"]
    rules: ["数値は3つまで", "増減はプラス=accent / マイナス=text_muted（赤緑は使わない）"]

  - id: T12_timeline
    name: タイムライン / ロードマップ
    use_when: "期間つきの計画を示すとき"
    layout: |
      page_title
      ──────────────────
        Q1      Q2      Q3      Q4
      ├──────┼──────┼──────┼──────┤
      [ bar        ]
              [ bar        ]
    slots: [page_title, "periods[]", "tracks[{name, bars[{from, to, label}]}]"]
    rules: ["トラックは4本まで", "バーは accent / grey / light の3色で塗り分け"]

  - id: T13_before_after
    name: Before / After
    use_when: "変化・改善を示すとき"
    layout: |
      page_title
      ──────────────────
      Before            →     After
      ・課題                  ・解決後
      ・課題                  ・解決後
      ──────────────────
      ▍変化のポイント
    slots: [page_title, "before[]", "after[]", takeaway]
    rules: ["Before は grey 系、After のみ accent 系", "項目数は左右で揃える"]

  - id: T14_emphasis
    name: 一言強調
    use_when: "話の転換点で一度だけ立ち止まらせたいとき"
    layout: |
      +--------------------------------------+
      |     「強調したい一文」                 |
      |      ─ 補足                          |
      +--------------------------------------+
    slots: [statement, sub]
    rules: ["デッキ全体で1〜2回まで。背景 bg_subtle、他要素なし", "本案件では p2 と p33 の2回のみ"]

  - id: T15_summary
    name: サマリ / まとめ
    use_when: "2枚目（結論先出し）または最終章"
    layout: |
      page_title
      ──────────────────
      ▍結論

      01 ポイント ─ 一行説明
      02 ポイント ─ 一行説明
      03 ポイント ─ 一行説明
    slots: [page_title, conclusion, "points[{label, body}]"]
    rules: ["ポイントは3つ。以降のページ見出しと文言を一致させる"]

  - id: T16_next
    name: ネクストアクション
    use_when: "最終ページ"
    layout: |
      page_title
      ──────────────────
      | アクション | 担当 | 期限 | 決めたいこと |
      |    …      |  …  |  …  |      …       |
      ──────────────────
      ▍本日決めたいこと
    slots: [page_title, "actions[{action, owner, due, decision}]", ask]
    rules: ["3〜5行", "依頼事項（ask）を必ず明記"]

  - id: T17_appendix
    name: Appendix
    use_when: "補足データ"
    layout: |
      Appendix / label
      ──────────────────
      （詳細データ・前提条件）
    slots: [label, body]
    rules: ["本編と同じデザイン。情報密度は上げてよいが色数は守る"]

  # --- 以下は本案件で追加したテンプレート ---

  - id: T18_cycle
    name: サイクル（循環）
    use_when: "終わりが始まりに戻る反復を示すとき。T09 の直線フローでは「①に戻る」が表現できない"
    layout: |
      page_title
      ──────────────────
              ┌──▶ ① label ──┐
              │              ▼
          ⑤ label        ② label
              ▲              │
              │              ▼
          ④ label ◀──── ③ label
      ──────────────────
      ▍key_message
    slots: [page_title, "steps[{no, label, body}]", highlight_step, key_message]
    rules:
      - "4〜5ステップ。円環に配置し、最後から最初へ戻る矢印を必ず描く"
      - "highlight_step に指定した1ステップのみ accent。他は text_muted、矢印は border"
      - "人がやる工程を highlight_step にする"

  - id: T19_stack
    name: 積み上げ層
    use_when: "下の層が上の層を支える依存関係を示すとき。並列カード（T06）では上下関係が消える"
    layout: |
      page_title
      ──────────────────
              [   最上層   ]
            [    第2層      ]
          [     第3層        ]
        [       土台          ]
      ──────────────────
      ▍key_message
    slots: [page_title, "layers[{label, body}]", key_message]
    rules:
      - "3〜4層。先頭が土台（最下段）、末尾が最上段"
      - "下ほど幅を広く取る。土台のみ accent_soft、他は bg_subtle"
      - "層の中に要素名を並べてよいが、層あたり2要素まで"

# --------------------------------------------------------------
# 全ページ共通の制約
# --------------------------------------------------------------
constraints:
  ng_source: "docs/design/design-system-notion-like.md#7-dos-and-dontsガードレール"

  checklist:
    - "各ページのキーメッセージだけを読んで筋が通るか"
    - "使用色が chart_palette の3色に収まっているか"
    - "数値に出典と期間があるか"
    - "余白がマージン規定を満たしているか"
    - "最終ページに担当・期限・依頼事項があるか"

  # 本案件固有のチェック
  deck_specific:
    - "「loop駆動」「複利化」が残っていないか（段階名は「ループ化」に統一）"
    - "部品名が「Agent」になっていないか（「Subagent」に統一）"
    - "「Instruction」が残っていないか（「Rule」に統一）"
    - "GitHub Copilot 前提の記述が残っていないか（対象は Claude のみ）"
    - "p8 と p36 のサイクル図が同じ形で描かれているか（p36 は p8 の再掲）"
    - "p5 のデモ画面が p21 で再掲されているか"

# --------------------------------------------------------------
# 素材
# --------------------------------------------------------------
materials:
  - path: "materials/ハンズオン_生成AI活用推進.pptx"
    kind: "document"
    used_by: []
    note: "旧版（GitHub Copilot 前提・全30枚）。本指示書の元ネタ。デザインは踏襲せず、内容の参照のみに使う"
  # TODO: p5 のデモ画面スクリーンショットを撮ったら materials/demo-*.png として追加し、
  #       used_by: [5, 21] で参照する（p21 の回収に必須）

# --------------------------------------------------------------
# 内容
# --------------------------------------------------------------
content:
  raw_input: |
    旧版 pptx（materials/ハンズオン_生成AI活用推進.pptx・全30枚・GitHub Copilot 前提）を
    起点に、対象を Claude のみへ変更し、別途実施したレビュー指摘を反映して再構成したもの。

    主な変更:
    - 対象ツールを Claude（Claude Code）のみに変更。Copilot 前提の記述と
      Appendix「Claude Code 対応表」を全廃
    - 合計90分（座学33分 / 実践47分 / 振り返り10分）に再配分
    - 段階名「loop駆動」を廃止し「ループ化」に統一。業界呼称は注記で残す
    - 部品名 Agent → Subagent（段階名との用語衝突を解消）
    - Instruction → Rule（.claude/rules/）に統一
    - 部品に MCP / Plugin を追加（旧版は4点セットのみ）
    - ループ化サイクル（5ステップ）を独立ページに昇格
    - 事前確認 / トリガー早見表 / 歯止め / 成果物イメージ / クロージングを新設
    - 実践を「作る→動かす→不満→修正→再実行」の2周構成に再設計

    未確定: ハンズオン用リポジトリ（Claude版）が再作成中のため、
    「※リポジトリ確定後に記載」の箇所は実物と揃えて後日埋める。

  pages:
    - no: 1
      template: T01_title
      values:
        eyebrow_label: "AI-DRIVEN WORK / Hands-on"
        title: "AI駆動で、業務をやる。"
        subtitle: "「開発」を超えて、すべての業務をAI駆動に。Skill / Rule / Subagent / Hook / MCP / Plugin ハンズオン"
        date: "2026-06-23"
        author: "※登壇者名を記載"

    - no: 2
