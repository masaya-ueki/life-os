        - "/speckit.specify: 要件とユーザーストーリーを書く。ここが仕様の正本になる"
        - "/speckit.plan: 技術的な実装計画に落とす"
        - "/speckit.tasks: 実行可能なタスク一覧に分解する"
        - "/speckit.implement: タスクを実行して作る。/speckit.converge で仕様との差分を検証する"
