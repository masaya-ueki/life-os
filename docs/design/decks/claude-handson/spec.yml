        一言の定義: Skill / Subagent / Hook / MCP をまとめてパッケージにし、インストールで配れるようにしたもの。
        特徴:
        - マーケットプレイス＝Git リポジトリ。社内のプライベートリポジトリでも同じ仕組みが使える
        - 同梱できるもの: skills/ ・ agents/ ・ hooks/hooks.json ・ .mcp.json ・ settings.json
