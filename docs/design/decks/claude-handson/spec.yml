        - "タイトルの材料: 汎用プラグイン ① — チームで Skill / Subagent を共有する"
        - "呼び出し方: .claude/ に直置き = /hello / プラグイン化 = /plugin-name:hello（名前空間つき）"
        - "共有範囲: 直置き = そのリポジトリの中だけ / プラグイン化 = マーケットプレイス経由で誰でも導入できる"
        - "更新の伝わり方: 直置き = 手でコピーする / プラグイン化 = /plugin marketplace update で全員に届く"
        - "向いている場面: 直置き = 個人の工夫、プロジェクト固有、素早い試行 / プラグイン化 = チーム共有、複数リポジトリでの再利用、バージョン管理"
      notes: |
        結論: まず .claude/ で作って回し、育ってから切り出す。最初からプラグインにしなくてよい。
        中身は Skill / Subagent / Hook / MCP設定 / LSP設定 / 監視 をまとめられる。ディレクトリは必ずプラグイン直下に置く（.claude-plugin/ の中に入れない）。
      avoid:
        - "部品名を「Agent」と書く"
      speaker_notes: "2つ目のリポジトリで同じ設定が要るときがプラグイン化のタイミング。最初からやらなくてよい。"

    - page: 42
      chapter: appendix
      role: Appendix
      message: "GitHub リポジトリ1つで、チーム全員が同じ Skill を使えるようになる"
      must_include:
        - "タイトルの材料: 汎用プラグイン ② — ハンズオン：タスク化スキルを共有資産にする"
        - "切り出す: .claude/skills/タスク化/SKILL.md を、新しいプラグイン用ディレクトリの skills/ 配下へコピーする"
        - "名乗らせる: .claude-plugin/plugin.json に name / description / version を書く。claude plugin init <名前> で雛形も作れる"
        - "手元で試す: claude --plugin-dir ./<プラグイン名> で起動し /<プラグイン名>:タスク化 が動くか確認する"
        - "配る: GitHub リポジトリの .claude-plugin/marketplace.json に name / owner / plugins を書いて push する"
        - "別リポジトリで使う: /plugin marketplace add <org>/<repo> → /plugin install タスク化@<マーケット名>"
      notes: |
